        function movieSearch() {
            let inputText = document.getElementById("inputSearch").value
            let lowerText = inputText.toLowerCase()

            let filterrArr = arr.filter(function (obj) {
                var movieList = obj.Name.toLocaleLowerCase()
                return movieList.includes(lowerText)
            })

            var container = document.getElementById("small-container")
            container.innerHTML = ""

            filterrArr.forEach(function (obj) {
                var box = document.createElement("div")
                box.className = "movie-card"
                var image = document.createElement("img")
                image.className = "movie-img"
                image.src = obj.path

                var movieInfo = document.createElement("div")
                movieInfo.className = "movie-info"
                var h3 = document.createElement("h3")
                h3.innerHTML = obj.Name
                var headspan = document.createElement("span")
                headspan.innerHTML = obj.Rating

                var btn = document.createElement("button")
                btn.className = "btn-play"
                btn.innerHTML = "Play Now"

                box.append(image, movieInfo)
                movieInfo.append(h3, headspan, btn)
                document.getElementById("small-container").append(box)



            })

        }
